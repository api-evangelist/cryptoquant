  description: >-
    This namespace cointains endpoints to retreive metrics related to regulated funds such as trust, including
    market price, market volume, market premium, and digital asset holdings. These metrics are useful
    to measure sentiments of investors such as institutions in regulated market. All Symbol will be updated
    no later then UTC 12:00, this may be changed depending on update time of source data. Also the return
    value may be changed because of late updated fund.


    <br/>


