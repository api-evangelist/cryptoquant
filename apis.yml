- aid: cryptoquant:cryptoquant-stablecoin-network-data-api
  name: CryptoQuant Stablecoin Network Data API
  description: >-
    This namespace contains endpoint to retrieve on-chain network data for stablecoins including token
    transfers, issuance, addresses, etc. The earliest data point of each token is listed as Contract Created
    Datetime. [here](#tag/Stablecoin Status)

    ### Stablecoin Issuing Mechanism

    Each individual Stablecoin is created by an issuing company and each of these companies operates with
    a different issue mechanism.

    There are many of these but the two most common are as follows.

    #### Example 1

    ![Ussuing Methodology 1](/docs/images/stable1.png)

    Before providing clients with the granting address, the issuing company holds a treasury address.
    Through the contract, the tokens are minted and held in the treasury address. Once the client sends
    fiat currency, the clients tokens are moved from the treasury address to the client address and the
    tokens are listed as being issued.

    Conversely, when redeeming tokens for fiat, the tokens are sent to the treasury address and redeemed.
    This won't be reflected in the supply unless these tokens are burned using a contract by the issuing
    company. The circulating supply is calculated as tokens that have been issued to clients, ignoring
    the supply held in the issuing company wallets.

    #### Example 2

    ![Ussuing Methodology 2](/docs/images/stable2.png)

    In this method, there is no separate treasury address. After confirming the deposit of fiat, tokens
    are minted from the contract address and delivered directly to the client address. Minting and issuance
    occur simultaneously. When clients redeem tokens, the burn and redemption also are simultaneous.

    This means that with this method, total supply and circulating supply will be the same. There are
    various methods for Stablecoin issuance, and we calculated supply and locate significant transactions.  based
    upon these types of factors. In the future, mint/issue/burn/redeem will be added our available metrics
    and will be defined as listed below.

    #### Terminology

    | Term           |   Definition  |

    |----------------|---------------|

    | Mint           |  Mint is a creation of new tokens that add to the supply. When tokens are minted,
    the total supply will increase.|

    | Issue          |  Issue is when tokens are delivered to clients after deposit of fiat has been confirmed.
    When tokens are issued, the circulating supply will increase.|

    | Burn           |  Burn is a revocation of currently existing tokens that results in a decreased
    supply. The opposite of Mint.|

    | Redeem         |  Redeem is an exchange of tokens for deposited fiat that results in a decrease
    in the circulating supply. The opposite of Issue.|
