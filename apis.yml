  description: >-
    This endpoint returns the flows of ERC20 tokens into exchange wallets for as far back as we track.
    Please note that the transfer generally occurs after a certain amount of time from the contract created
    time.

    We constantly keep updating new exchange wallets, which means that there can be slight modification
    in values especially for recent data points.

    The update is done in periodic and automatic way: Tuesday 00:00 UTC every week.

    Supported exchanges can be found in the `/erc20/status/entity-list` endpoint.

    In addition to that, we support the following aggregated exchanges:


    <br/>


    ### Supported Aggregated Exchanges

    | Name       |   Exchange       | Supported ERC20 Tokens |

    |----------------|----------------|-------------------------------|

    |   All Exchanges  | `all_exchange` | All Tokens |

    |   Spot Exchanges  | `spot_exchange` | All Tokens |

    |   Derivative Exchanges  | `derivative_exchange` | All Tokens |


    <br/>


    > **Note:** This endpoint does not support Point-In-Time (PIT) accuracy due to periodic updates to
    wallet address clustering. Historical data may change as new exchange wallets are discovered, added,
    and validated.


    <br/>
