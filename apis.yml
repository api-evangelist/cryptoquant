- aid: cryptoquant:cryptoquant-eth-2-0-api
  name: CryptoQuant ETH 2.0 API
  description: >-
    Genesis event of ETH 2.0 requires at least 16,384 of 32-ETH validator deposits seven days before Dec
    1. If not, the genesis event would postpone seven days after. We have only valid transactions in the
    calculations. Looking at the ETH2 deposit contract, Only from 32 to 1000 deposits are considered as
    valid deposits.

    When Phase 0 success rate hits 100% and Phase 0 unique validator hits 16,384, the Ethereum genesis
    event starts.
