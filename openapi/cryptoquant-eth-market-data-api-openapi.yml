        source: "require('axios')\n  .get(\"https://api.cryptoquant.com/v1/eth/market-data/open-interest?window=day&from=20191001&exchange=bitmex\", { headers: { Authorization: 'Bearer <YOUR_API_KEY>' } })\n  .then(response => console.log(response))"
