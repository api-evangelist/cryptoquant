openapi: 3.2.0
info:
  version: 1.3.0
  title: CryptoQuant Data ETH Market Data API
  termsOfService: https://cryptoquant.com/terms-of-service
  contact:
    name: API Support
    email: contact@cryptoquant.com
  description: The CryptoQuant Data API provides simple and powerful endpoints to get information on general transaction data and aggregate on-chain statistics straight from the blockchain. The API root endpoint URL is `https://api.cryptoquant.com/v1/`.
servers:
- url: https://api.cryptoquant.com/v1
  description: Default server
tags:
- name: ETH Market Data
  description: 'This namespace contains endpoints to retrieve metrics related to the value of ETH including price, etc.

    We provide USD and USDT spot price of ETH from global exchanges and ETH index price. CryptoQuant''s ETH index price is VWAP(Volume Weighted Average Price) of aggregated price data from all exchanges we provide.

    For more detailed information, please refer to the description of each metric.'
paths:
  /eth/market-data/price-ohlcv:
    get:
      tags:
      - ETH Market Data
      summary: Price OHLCV
      description: 'This endpoint returns metrics related to ETH price. We provide two types of price, CryptoQuant''s ETH Index Price and USD or USDT price of ETH of global exchanges. Price OHLCV data consists of five metrics. `open`, the opening price at the beginning of the window, `close`, USD closing price at the end of the window,

        `high`, the highest USD price in a given window, `low`, the lowest USD price in a given window,

        and `volume`, the total volume traded in a given window. At this endpoint, metrics are calculated by Minute, Hour and Day. ETH Index Price is calculated by taking VWAP(Volume Weighted Average Price) of ETH price data aggregated from all exchanges we provide. The exchanges we provide are as follows. ### Supported Exchanges By Market


        | Name | Market | Supported Exchanges |

        |--------|---------|----------------------------|

        | Spot | `spot` | All Exchange*, Binance, Binance US, Bitfinex, Bittrex, Coinbase Advanced, FTX**, Gemini, HTX Global, Kraken, OKX |

        | Perpetual | `perpetual` | All Exchange*, Binance, Bitmex, Bybit, Deribit, FTX**, HTX Global, OKX |


        > (*) Default exchange


        > (**) Use in cautions due to the deprecation (no data update)


        In order to get USD or USDT price of ETH of specific exchange from above (eg. `ethusdt` pair of `binance`),

        you must specify `market`, `exchange` and `symbol` of ETH pair. For `volume` metric, the unit of volume could be USD, USDT or ETH. This is because exchanges have their own price data policy. All Exchange''s `volume` is in ETH. Please refer to volume unit of each exchange from below table. ### Supported Pairs By Exchange


        #### ◦ Spot

        | Name | Exchange | Symbol | Volume Unit | Available Since |

        |----------------|------------------|---------------------------|--------------|-------------------------------|

        | All Exchange | `all_exchange` | `eth_usd`* | ETH | The earliest time in the exchanges below. |

        | Binance | `binance` | `eth_usdt`* | ETH | 2017-08-17 04:00:00 |

        | Binance US | `binance_us` | `eth_usd`*

        `eth_usdt` | ETH | 2019-09-18 14:58:00

        2019-09-23 08:36:00 |

        | Bitfinex | `bitfinex` | `eth_usd`*

        `eth_usdt` | ETH | 2016-03-09 16:04:00

        2019-03-11 10:03:00 |

        | Bittrex | `bittrex` | `eth_usd`*

        `eth_usdt` | USD

        USDT | 2018-06-21 02:17:00

        2017-04-21 13:30:00 |

        | Coinbase Advanced | `coinbase_advanced` | `eth_usd`* | ETH | 2016-05-18 00:14:00


        | FTX** | `ftx` | `eth_usd`*

        `eth_usdt` | USD

        USDT | 2019-09-14 21:07:00

        2020-03-28 14:40:00 |

        | Gemini | `gemini` | `eth_usd`* | ETH | 2019-08-30 00:00:00 |

        | HTX Global | `htx_global` | `eth_usdt`* | ETH | 2019-11-19 00:00:00 |

        | Kraken | `kraken` | `eth_usd`*

        `eth_usdt` | ETH | 2015-08-07 14:03:00

        2019-12-19 16:49:00 |

        | OKX | `okx` | `eth_usdt`* | ETH | 2019-10-01 00:00:00 |


        #### ◦ Perpetual

        | Exchange | Exchange Symbol | Pair Symbol | Volume | Historical Starting Point |

        |----------------|------------------|-------------------------------|-------------------|--------------------------------|

        | All Exchange | `all_exchange` | `eth_usd`* | ETH | The earliest time in the exchanges below. |

        | Binance | `binance` | `eth_usd`*

        `eth_usdt` | Cont

        ETH | 2020-08-11 07:02:00

        2019-09-08 17:57:00 |

        | Bitmex | `bitmex` | `eth_usd`* | Cont | 2015-09-25 12:34:00 |

        | Bybit | `bybit` | `eth_usd`*

        `eth_usdt` | USD

        ETH | 2018-11-14 16:00:00

        2020-03-25 10:36:00 |

        | Deribit | `deribit` | `eth_usd`* | USD | 2018-08-14 10:34:00 |

        | FTX** | `ftx` | `eth_usd`* | USD | 2019-07-20 12:35:00 |

        | HTX Global | `htx_global` | `eth_usd`*

        `eth_usdt` | Cont

        ETH | 2020-03-25 09:45:00

        2020-10-21 09:08:00 |

        | OKX | `okx` | `eth_usd`*

        `eth_usdt` | Cont

        ETH | 2019-03-30 00:00:00

        2019-12-25 00:00:00 |


        > (*) Default exchange


        > (**) Use in cautions due to the deprecation (no data update)


        > We calculate the OHLCV data of a day from the beginning of UTC 00:00:00. > However, the OHLCV data in official sites of HTX and OKX are calculated from the beginning of UTC 16:00:00. > Thus, be aware that there may be some intended discrepancy between those.'
      operationId: getETHPriceOHLCV
      parameters:
      - description: A market type from the table that we support. [See here](#operation/getETHPriceOHLCV)
        explode: false
        in: query
        name: market
        required: false
        schema:
          type: string
          default: spot
        style: form
        example: spot
      - description: A exchange from the table that we support. [See here](#operation/getETHPriceOHLCV).
        explode: false
        in: query
        name: exchange
        required: false
        schema:
          type: string
          default: all_exchange
        style: form
        example: binance
      - description: A ETH pair symbol from the table that we support. [See here](#operation/getETHPriceOHLCV)
        explode: false
        in: query
        name: symbol
        required: false
        schema:
          type: string
        style: form
        example: eth_usd
      - description: A window from the table that we support. [See here](#operation/getETHPriceOHLCV)
        explode: false
        in: query
        name: window
        schema:
          type: string
          default: day
        style: form
        example: day
      - description: This defines the starting time for which data will be gathered, formatted as YYYYMMDDTHHMMSS (indicating YYYY-MM-DDTHH:MM:SS, UTC time). If window=day is used, it can also be formatted as YYYYMMDD (date). If window=block is used, you can also specify the exact block height (e.g. 510000). If this field is not specified, response will include data from the earliest time.
        explode: false
        in: query
        name: from
        required: false
        schema:
          type: string
        style: form
        example: 20191001T100000
      - description: This defines the ending time for which data will be gathered, formatted as YYYYMMDDTHHMMSS (indicating YYYY-MM-DDTHH:MM:SS, UTC time). If window=day is used, it can also be formatted as YYYYMMDD (date). If window=block is used, you can also specify the exact block height (e.g. 510000). If this field is not specified, response will include data from the latest time.
        explode: false
        in: query
        name: to
        required: false
        schema:
          type: string
        style: form
        example: 20191001T103025
      - description: The maximum number of entries to return before the latest data point (or before `to` if specified). This field ranges from 1 to 100,000.
        explode: false
        in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 100000
        style: form
        example: 100
      - description: A format type about return message type. Supported formats are json, csv.
        explode: false
        in: query
        name: format
        required: false
        schema:
          type: string
          default: json
        style: form
        example: json
      x-codeSamples:
      - lang: Shell
        source: 'curl -X GET "https://api.cryptoquant.com/v1/eth/market-data/price-ohlcv?window=day&from=20191001&limit=2" \

          -H "Authorization: Bearer <YOUR_API_KEY>"'
      - lang: JavaScript
        source: "fetch(\"https://api.cryptoquant.com/v1/eth/market-data/price-ohlcv?window=day&from=20191001&limit=2\", { headers: { \"Authorization\": \"Bearer <YOUR_API_KEY>\"} })\n  .then(response => response.json())\n  .then(data => console.log(data))"
      - lang: NodeJS
        source: "require('axios')\n  .get(\"https://api.cryptoquant.com/v1/eth/market-data/price-ohlcv?window=day&from=20191001&limit=2\", { headers: { Authorization: 'Bearer <YOUR_API_KEY>' } })\n  .then(response => console.log(response))"
      - lang: Ruby
        source: 'require ''net/http''

          uri = URI("https://api.cryptoquant.com/v1/eth/market-data/price-ohlcv?window=day&from=20191001&limit=2")

          req = Net::HTTP::Get.new(uri)

          req["Authorization"] = "Bearer <YOUR_API_KEY>"

          res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }

          puts res.body'
      - lang: Python
        source: 'import requests

          headers = {''Authorization'': ''Bearer <YOUR_API_KEY>''}

          url = "https://api.cryptoquant.com/v1/eth/market-data/price-ohlcv?window=day&from=20191001&limit=2"

          print(requests.get(url, headers=headers).json())'
      responses:
        '200':
          description: Price OHLCV Data
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - result
                properties:
                  status:
                    type: object
                    description: The status object is return with most of requests and indicates if the request was successful. If it is not successful, error information is included.
                    properties:
                      code:
                        type: integer
                        format: int32
                        description: HTTP status code
                      message:
                        type: string
                        description: Text description of the error or success.
                    required:
                    - code
                    - message
                  result:
                    type: object
                    required:
                    - window
                    - data
                    properties:
                      window:
                        type: string
                        description: The size of window. It can be day, hour, min, or block and it depends on the user request.
                      data:
                        type: array
                        items:
                          type: object
                          required:
                          - open
                          - high
                          - low
                          - close
                          - volume
                          properties:
                            blockheight:
                              type: string
                              description: The height of the block. This optional field only appears when window=block is used.
                            date:
                              type: string
                              description: The date in YYYY-DD-MM. This optional field only appears when window=day is used.
                            datetime:
                              type: string
                              description: The date and time formatted as YYYY-MM-DD HH:MM:SS (UTC time). This field only appears when window=block is used.
                            open:
                              type: number
                              description: opening price at the beginning of the window.
                            high:
                              type: number
                              description: opening price at the end of the window.
                            low:
                              type: number
                              description: The highest price in a given window.
                            close:
                              type: number
                              description: The lowest price in a given window.
                            volume:
                              type: number
                              description: The total traded amount in a given window.
              example:
                status:
                  code: 200
                  message: success
                result:
                  window: day
                  data:
                  - date: '2026-06-14'
                    open: 1678.28
                    high: 1731.14
                    low: 1653.21
                    close: 1724.46
                    volume: 404775.91
                  - date: '2026-06-13'
                    open: 1665.34
                    high: 1696.29
                    low: 1660.89
                    close: 1679.4
                    volume: 273566.84
      security:
      - AccessToken: []
  /eth/market-data/open-interest:
    get:
      tags:
      - ETH Market Data
      summary: Open Interest
      description: 'This endpoint returns ETH Perpetual Open Interest from derivative exchanges. Supported exchanges for Open Interest are below. Note we unify the unit of return value to USD for each exchange where its contract specification may vary.


        | Name | Exchange | Symbol | Available Since |

        |----------------|--------------|-------------|-----------------------------|

        | All Exchanges | `all_exchange` | `all_symbol` | The earliest time in the exchanges below. |

        | Binance | `binance` | `all_symbol`

        `eth_usd`

        `eth_usdt` | The earliest time in the symbols.

        2020-08-18 00:00:00

        2020-05-14 00:00:00 |

        | Bitfinex | `bitfinex` | `all_symbol`

        `eth_usdt` | The earliest time in the symbols.

        2020-06-01 00:00:00 |

        | Bitmex | `bitmex` | `all_symbol`

        `eth_usd` | The earliest time in the symbols.

        2019-03-30 00:00:00 |

        | Bybit | `bybit` | `all_symbol`

        `eth_usd`

        `eth_usdt` | The earliest time in the symbols.

        2019-11-07 00:00:00

        2020-10-21 00:00:00 |

        | Deribit | `deribit` | `all_symbol`

        `eth_usd` | The earliest time in the symbols.

        2019-03-31 00:00:00 |

        | FTX** | `ftx` | `all_symbol`

        `eth_usd` | The earliest time in the symbols.

        2020-05-09 00:00:00 |

        | Gate.io | `gate_io` | `all_symbol`

        `eth_usd`

        `eth_usdt` | The earliest time in the symbols.

        2020-07-01 00:00:00

        2020-07-01 00:00:00 |

        | HTX | `htx_global` | `all_symbol`

        `eth_usd`

        `eth_usdt` | The earliest time in the symbols.

        2020-06-24 00:00:00

        2021-08-26 05:00:00 |

        | Kraken | `kraken` | `all_symbol`

        `eth_usd` | The earliest time in the symbols.

        2019-03-30 00:00:00 |

        | OKX | `okx` | `all_symbol`

        `eth_usd`

        `eth_usdt` | The earliest time in the symbols.

