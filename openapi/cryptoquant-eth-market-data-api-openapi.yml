  /eth/market-data/funding-rates:
    get:
      tags:
      - ETH Market Data
      summary: Funding Rates
      description: 'Funding rates represents traders'' sentiments of which position they bet on in perpetual swaps market. Positive funding rates implies that many traders are bullish and long traders pay funding to short traders. Negative funding rates implies many traders are bearish and short traders pay funding to long traders.


        | Name | Exchange | Symbol | Available Since |

        |----------------|--------------|----|-------------------------|

        | All Exchanges | `all_exchange` | | The earliest time in the exchanges below. |

        | Binance | `binance` | ETH-USDT | 2019-11-29 00:00:00 |

        | Bybit | `bybit` | ETH-USD | 2019-01-25 08:00:00 |

        | Bitmex | `bitmex` | ETH-USD | 2018-08-02 12:00:00 |

        | Deribit | `deribit` | ETH-PERPETUAL | 2019-10-04 00:00:00 |

        | HTX Global | `htx_global` | ETH-USD | 2020-07-04 00:01:00 |

        | OKX | `okx` | ETH-USD | 2019-04-02 02:00:00 |


        **📖 Data Guide:** Funding Rates — definition, interpretation, and chart examples.'
