openapi: 3.2.0
info:
  version: 1.3.0
  title: CryptoQuant Data ERC20 Network Data API
  termsOfService: https://cryptoquant.com/terms-of-service
  contact:
    name: API Support
    email: contact@cryptoquant.com
  description: The CryptoQuant Data API provides simple and powerful endpoints to get information on general transaction data and aggregate on-chain statistics straight from the blockchain. The API root endpoint URL is `https://api.cryptoquant.com/v1/`.
servers:
- url: https://api.cryptoquant.com/v1
  description: Default server
tags:
- name: ERC20 Network Data
paths:
  /erc20/network-data/supply:
    get:
      tags:
      - ERC20 Network Data
      summary: Supply
      description: This endpoint returns metrics related to the supply of ERC20 tokens, i.e. the amount of ERC20s tokens in existence. We currently provide three metrics, `supply_total`, the total amount of ERC20 tokens in existence, `supply_minted`, the amount of newly issued tokens, and `supply_burned`, the amount of newly burnt tokens in a given window.
      operationId: getSupplyERC20
      parameters:
      - description: A ERC20 token from the table that we support. [See here](#tag/Supported-ERC20-List)
        explode: false
        in: query
        name: token
        required: true
        schema:
          type: string
        style: form
        example: link
      - description: Currently we support `day`, `hour`, `10min`, and `block`.
        explode: false
        in: query
        name: window
        schema:
          type: string
          default: day
        style: form
        example: day
      - description: This defines the starting time for which data will be gathered, formatted as YYYYMMDDTHHMMSS (indicating YYYY-MM-DDTHH:MM:SS, UTC time). If window=day is used, it can also be formatted as YYYYMMDD (date). If window=block is used, you can also specify the exact block height (e.g. 510000). If this field is not specified, response will include data from the earliest time.
        explode: false
        in: query
        name: from
        required: false
        schema:
          type: string
        style: form
        example: 20191001T100000
      - description: This defines the ending time for which data will be gathered, formatted as YYYYMMDDTHHMMSS (indicating YYYY-MM-DDTHH:MM:SS, UTC time). If window=day is used, it can also be formatted as YYYYMMDD (date). If window=block is used, you can also specify the exact block height (e.g. 510000). If this field is not specified, response will include data from the latest time.
        explode: false
        in: query
        name: to
        required: false
        schema:
          type: string
        style: form
        example: 20191001T103025
      - description: The maximum number of entries to return before the latest data point (or before `to` if specified). This field ranges from 1 to 100,000.
        explode: false
        in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 100000
        style: form
        example: 100
      - description: A format type about return message type. Supported formats are json, csv.
        explode: false
        in: query
        name: format
        required: false
        schema:
          type: string
          default: json
        style: form
        example: json
      x-codeSamples:
      - lang: Shell
        source: 'curl -X GET "https://api.cryptoquant.com/v1/erc20/network-data/supply?token=link&window=day" \

          -H "Authorization: Bearer <YOUR_API_KEY>"'
      - lang: JavaScript
        source: "fetch(\"https://api.cryptoquant.com/v1/erc20/network-data/supply?token=link&window=day\", { headers: { \"Authorization\": \"Bearer <YOUR_API_KEY>\"} })\n  .then(response => response.json())\n  .then(data => console.log(data))"
      - lang: NodeJS
        source: "require('axios')\n  .get(\"https://api.cryptoquant.com/v1/erc20/network-data/supply?token=link&window=day\", { headers: { Authorization: 'Bearer <YOUR_API_KEY>' } })\n  .then(response => console.log(response))"
      - lang: Ruby
        source: 'require ''net/http''

          uri = URI("https://api.cryptoquant.com/v1/erc20/network-data/supply?token=link&window=day")

          req = Net::HTTP::Get.new(uri)

          req["Authorization"] = "Bearer <YOUR_API_KEY>"

          res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }

          puts res.body'
      - lang: Python
        source: 'import requests

          headers = {''Authorization'': ''Bearer <YOUR_API_KEY>''}

          url = "https://api.cryptoquant.com/v1/erc20/network-data/supply?token=link&window=day"

          print(requests.get(url, headers=headers).json())'
      responses:
        '200':
          description: supply_total, supply_minted, supply_burned.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - result
                properties:
                  status:
                    type: object
                    description: The status object is return with most of requests and indicates if the request was successful. If it is not successful, error information is included.
                    properties:
                      code:
                        type: integer
                        format: int32
                        description: HTTP status code
                      message:
                        type: string
                        description: Text description of the error or success.
                    required:
                    - code
                    - message
                  result:
                    type: object
                    required:
                    - window
                    - data
                    properties:
                      window:
                        type: string
                        description: The size of window. It can be day, hour, 10min, or block and it depends on the user request.
                      data:
                        type: array
                        items:
                          type: object
                          required:
                          - supply_total
                          - supply_minted
                          - supply_burned
                          properties:
                            blockheight:
                              type: string
                              description: The height of the block. This optional field only appears when window=block is used.
                            date:
                              type: string
                              description: The date in YYYY-DD-MM. This optional field only appears when window=day is used.
                            datetime:
                              type: string
                              description: The date and time formatted as YYYY-MM-DD HH:MM:SS (UTC time). This field only appears when window=block, window=10min, or window=hour is used.
                            supply_total:
                              type: number
                              description: The total amount of ERC20 tokens in existence.
                            supply_minted:
                              type: number
                              description: The sum of newly issued tokens in that window.
                            supply_burned:
                              type: number
                              description: The sum of newly burnt tokens in that window.
              example:
                status:
                  code: 200
                  message: success
                result:
                  window: day
                  data:
                  - date: '2026-06-14'
                    supply_total: 1000000000
                    supply_minted: 0
                    supply_burned: 0
                  - date: '2026-06-13'
                    supply_total: 1000000000
                    supply_minted: 0
                    supply_burned: 0
      security:
      - AccessToken: []
  /erc20/network-data/velocity:
    get:
      tags:
      - ERC20 Network Data
      summary: Velocity
      description: This endpoint returns metrics related to the velocity of ERC20 tokens. Velocity is calculated by dividing the trailing 1 year estimated transaction volume(the cumulated sum of transferred tokens) by current supply. Velocity is a metric that explains how actively is money circulating in the market.
      operationId: getVelocityERC20
      parameters:
      - description: A ERC20 token from the table that we support. [See here](#tag/Supported-ERC20-List)
        explode: false
        in: query
        name: token
        required: true
        schema:
          type: string
        style: form
        example: link
      - description: Currently we support `day`, `hour`, `10min`, and `block`.
        explode: false
        in: query
