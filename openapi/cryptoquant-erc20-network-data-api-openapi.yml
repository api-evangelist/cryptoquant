  /erc20/network-data/tokens-transferred:
    get:
      tags:
      - ERC20 Network Data
      summary: Tokens Transferred
      description: This endpoint returns metrics related to the number of tokens transferred, i.e transaction volume. We provide several metrics, `tokens_transferred_total`, the total number of transferred tokens in that window, `tokens_transferred_mean`, the mean of transferred tokens per transaction in that window, and `tokens_transferred_median`, the median of tokens transferred per transaction.
      operationId: getTokensTransferredERC20
      parameters:
      - description: A ERC20 token from the table that we support. [See here](#tag/Supported-ERC20-List)
        explode: false
        in: query
        name: token
        required: true
