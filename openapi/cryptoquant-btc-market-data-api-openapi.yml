  /btc/market-data/funding-rates:
    get:
      tags:
      - BTC Market Data
      summary: Funding Rates
      description: 'Funding rates represents traders'' sentiments of which position they bet on in perpetual swaps market. Positive funding rates implies that many traders are bullish and long traders pay funding to short traders. Negative funding rates implies many traders are bearish and short traders pay funding to long traders.


        | Name | Exchange | Symbol | Available Since |

        |----------------|--------------|----|-------------------------|

        | All Exchanges | `all_exchange` | | The earliest time in the exchanges below. |

        | Binance | `binance` | BTC-USDT | 2019-09-10 00:00:00 |

        | Bybit | `bybit` | BTC-USD | 2019-12-01 00:00:00 |

        | Bitmex | `bitmex` | BTC-USD | 2016-05-14 04:00:00 |

        | Deribit | `deribit` | BTC-PERPETUAL | 2019-03-30 00:00:00 |

        | HTX Global | `htx_global` | BTC-USD | 2020-03-25 04:00:00 |

        | OKX | `okx` | BTC-USD | 2019-04-01 00:00:00 |


        **📖 Data Guide:** Funding Rates — definition, interpretation, and chart examples.'
      operationId: BTCgetFundingRates
      parameters:
      - description: A derivative exchange from the table that we support. [See here](#operation/getFundingRates).
        explode: false
        in: query
        name: exchange
        required: true
        schema:
          type: string
        style: form
        example: bitmex
      - description: Currently we support `day`, `hour`, and `min`.
