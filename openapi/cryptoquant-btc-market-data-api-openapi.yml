      - lang: Shell
        source: 'curl -X GET "https://api.cryptoquant.com/v1/btc/market-data/funding-rates?window=day&from=20191001&exchange=bitmex" \

          -H "Authorization: Bearer <YOUR_API_KEY>"'
      - lang: JavaScript
        source: "fetch(\"https://api.cryptoquant.com/v1/btc/market-data/funding-rates?window=day&from=20191001&exchange=bitmex\", { headers: { \"Authorization\": \"Bearer <YOUR_API_KEY>\"} })\n  .then(response => response.json())\n  .then(data => console.log(data))"
      - lang: NodeJS
        source: "require('axios')\n  .get(\"https://api.cryptoquant.com/v1/btc/market-data/funding-rates?window=day&from=20191001&exchange=bitmex\", { headers: { Authorization: 'Bearer <YOUR_API_KEY>' } })\n  .then(response => console.log(response))"
