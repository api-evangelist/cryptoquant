  /eth/fund-data/market-premium:
    get:
      tags:
      - ETH Fund Data
      summary: Market Premium
      description: 'The premium of certain symbol (e.g. ethe) is defined as (market price of the symbol - NAV) divided by NAV where NAV (Native Asset Value) is the current value of holdings (e.g. ETH price multiplied by ETH per Share). Higher the premium indicates market bullish, which also indicates downside risk. On the other hand, lower the premium indicates market bearish, which also indicates upside risk. All Symbol market premium is calculated by taking VWAP (Volume Weighted Average Ratio) of each fund data volume (usd).


        **📖 Data Guide:** ETHE Premium or Discount — definition, interpretation, and chart examples.'
      operationId: getETHMarketPremium
      parameters:
