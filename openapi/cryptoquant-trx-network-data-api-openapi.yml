openapi: 3.2.0
info:
  version: 1.3.0
  title: CryptoQuant Data TRX Network Data API
  termsOfService: https://cryptoquant.com/terms-of-service
  contact:
    name: API Support
    email: contact@cryptoquant.com
  description: The CryptoQuant Data API provides simple and powerful endpoints to get information on general transaction data and aggregate on-chain statistics straight from the blockchain. The API root endpoint URL is `https://api.cryptoquant.com/v1/`.
servers:
- url: https://api.cryptoquant.com/v1
  description: Default server
tags:
- name: TRX Network Data
  description: This namespace contains endpoints to retrieve metrics related to TRX Network Data.
paths:
  /trx/network-data/supply:
    get:
      tags:
      - TRX Network Data
      summary: Supply
      description: 'This endpoint returns the metrics related to the supply of TRX.

        | Metric | Description |

        |--------|-------------|

        | `supply_total` | The total amount of tokens in existence. |

        | `supply_circulating` | The amount of tokens that are circulating in the market. |

        | `supply_minted` | The amount of tokens minted in the given window. |

        | `supply_burned` | The amount of tokens burned in the given window. |

        | `supply_staked` | The amount of tokens staked in Tron Super Representative members. |'
      operationId: TRXNetworkDatagetSupply
      parameters:
      - description: Currently, we only support `day`.
        explode: false
        in: query
        name: window
        schema:
          type: string
          default: day
        style: form
        example: day
      - description: This defines the starting time for which data will be gathered, formatted as YYYYMMDDTHHMMSS (indicating YYYY-MM-DDTHH:MM:SS, UTC time). If window=day is used, it can also be formatted as YYYYMMDD (date). If window=block is used, you can also specify the exact block height (e.g. 510000). If this field is not specified, response will include data from the earliest time.
        explode: false
        in: query
        name: from
        required: false
        schema:
          type: string
        style: form
        example: 20191001T100000
      - description: This defines the ending time for which data will be gathered, formatted as YYYYMMDDTHHMMSS (indicating YYYY-MM-DDTHH:MM:SS, UTC time). If window=day is used, it can also be formatted as YYYYMMDD (date). If window=block is used, you can also specify the exact block height (e.g. 510000). If this field is not specified, response will include data from the latest time.
        explode: false
        in: query
        name: to
        required: false
        schema:
          type: string
        style: form
        example: 20191001T103025
      - description: The maximum number of entries to return before the latest data point (or before `to` if specified). This field ranges from 1 to 100,000.
        explode: false
        in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 100000
        style: form
        example: 100
      - description: A format type about return message type. Supported formats are json, csv.
        explode: false
        in: query
        name: format
        required: false
        schema:
          type: string
          default: json
        style: form
        example: json
      x-codeSamples:
      - lang: Shell
        source: 'curl -X GET "https://api.cryptoquant.com/v1/trx/network-data/supply?window=day&from=20190416&limit=2" \

          -H "Authorization: Bearer <YOUR_API_KEY>"'
      - lang: JavaScript
        source: "fetch(\"https://api.cryptoquant.com/v1/trx/network-data/supply?window=day&from=20190416&limit=2\", { headers: { \"Authorization\": \"Bearer <YOUR_API_KEY>\"} })\n  .then(response => response.json())\n  .then(data => console.log(data))"
      - lang: NodeJS
        source: "require('axios')\n  .get(\"https://api.cryptoquant.com/v1/trx/network-data/supply?window=day&from=20190416&limit=2\", { headers: { Authorization: 'Bearer <YOUR_API_KEY>' } })\n  .then(response => console.log(response))"
      - lang: Ruby
        source: 'require ''net/http''

          uri = URI("https://api.cryptoquant.com/v1/trx/network-data/supply?window=day&from=20190416&limit=2")

          req = Net::HTTP::Get.new(uri)

          req["Authorization"] = "Bearer <YOUR_API_KEY>"

          res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }

          puts res.body'
      - lang: Python
        source: 'import requests

          headers = {''Authorization'': ''Bearer <YOUR_API_KEY>''}

          url = "https://api.cryptoquant.com/v1/trx/network-data/supply?window=day&from=20190416&limit=2"

          print(requests.get(url, headers=headers).json())'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - result
                properties:
                  status:
                    type: object
                    description: The status object is return with most of requests and indicates if the request was successful. If it is not successful, error information is included.
                    properties:
                      code:
                        type: integer
                        format: int32
                        description: HTTP status code
                      message:
                        type: string
                        description: Text description of the error or success.
                    required:
                    - code
                    - message
                  result:
                    type: object
                    required:
                    - window
                    - data
                    properties:
                      window:
                        type: string
                        description: The size of window. This metric supports only day resolution.
                      data:
                        type: array
                        items:
                          type: object
                          required:
                          - supply_total
                          - supply_circulating
                          - supply_minted
                          - supply_burned
                          - supply_staked
                          properties:
                            date:
                              type: string
                              description: The date in YYYY-DD-MM. This optional field only appears when window=day is used.
                            supply_total:
                              type: number
                              description: The total amount of TRX.
                            supply_circulating:
                              type: number
                              description: The circulating amount of TRX.
                            supply_minted:
                              type: number
                              description: The minted amount of TRX.
                            supply_burned:
                              type: number
                              description: The burned amount of TRX.
                            supply_staked:
                              type: number
                              description: The staked amount of TRX.
              example:
                status:
                  code: 200
                  message: success
                result:
                  window: day
                  data:
                  - date: '2026-06-13'
                    supply_total: 94829237976
                    supply_circulating: 48892422853
                    supply_minted: 3915712
                    supply_burned: 2037865
                    supply_staked: 45936815123
                  - date: '2026-06-12'
                    supply_total: 94827360130
                    supply_circulating: 48896429643
                    supply_minted: 3915712
                    supply_burned: 2750027
                    supply_staked: 45930930487
          description: Successful response.
      security:
      - AccessToken: []
