  /btc/flow-indicator/stablecoins-ratio:
    get:
      tags:
      - BTC Flow Indicator
      summary: Stablecoins Ratio
      description: 'BTC reserve divided by all stablecoins reserve held by an exchange. This usually indicates potential sell pressure. Supported exchanges are determined by the concurrent validity of both BTC and Stablecoins (for at least 1 token).


        > **Note:** This endpoint supports a maximum of 1,000 entries per request.


        **📖 Data Guide:** Stablecoins Ratio — definition, interpretation, and chart examples.'
      operationId: BTCgetStablecoinsRatio
      parameters:
      - description: An exchange that supports both BTC and Stablecoins. See here [for BTC](#tag/BTC-Exchange-Flows) and [for Stablecoins](#tag/Stablecoin-Exchange-Flows).
        explode: false
        in: query
        name: exchange
        required: true
        schema:
          type: string
        style: form
        example: binance
      - description: Currently, we support `day` and `hour`.
        explode: false
        in: query
        name: window
        schema:
          type: string
          default: day
