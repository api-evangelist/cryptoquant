openapi: 3.2.0
info:
  version: 1.3.0
  title: CryptoQuant Data Latency API
  termsOfService: https://cryptoquant.com/terms-of-service
  contact:
    name: API Support
    email: contact@cryptoquant.com
  description: The CryptoQuant Data API provides simple and powerful endpoints to get information on general transaction data and aggregate on-chain statistics straight from the blockchain. The API root endpoint URL is `https://api.cryptoquant.com/v1/`.
servers:
- url: https://api.cryptoquant.com/v1
  description: Default server
tags:
- name: Latency
  description: Data freshness. Append `/latency` to any v1 data endpoint to see how long after a block its data becomes collectable and fully processed.
paths:
  /btc/exchange-flows/reserve/latency:
    get:
      tags:
      - Latency
      summary: Reserve Latency
      operationId: getReserveLatency
      description: 'Reports how fresh this metric''s data is. **Append `/latency` to ANY v1 data endpoint** (e.g. `/btc/network-data/hashrate/latency`) to get the same shape for that metric.


        - `block` — seconds from a block until the data point is **collectable**.

        - `process` — seconds from a block until the data point is **fully processed and queryable**.

        - `mutable` — whether already-served values may still be revised.


        Values are reported per resolution (`block` / `hour` / `day` / `min`) and averaging window. See the Data Latency guide for how to read them.'
      security:
      - AccessToken: []
      - QueryParameter: []
      responses:
        '200':
          description: Latency broken down by resolution and averaging window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                  result:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            all_parameters:
                              type: boolean
                            block:
                              type: array
                              items:
                                type: object
                            hour:
                              type: array
                              items:
                                type: object
                            day:
                              type: array
                              items:
                                type: object
              example:
                status:
                  code: 200
                  message: success
                result:
                  data:
                  - all_parameters: true
                    block:
                    - block:
                        10min: P0DT0H5M19.666667S
                        60min: P0DT0H7M50.25S
                      process:
                        10min: P0DT0H16M23.333333S
                        60min: P0DT0H16M15.375S
                      mutable: true
                    hour:
                    - block:
                        24hour: P0DT0H10M16.708333S
                        168hour: P0DT0H12M1.221557S
                      process:
                        24hour: P0DT0H30M18.734043S
                        168hour: P0DT0H28M58.78117S
                      mutable: true
                    day:
                    - block:
                        7day: P0DT0H13M56.714286S
                        30day: P0DT0H10M39.766667S
                      process:
                        7day: P0DT0H26M15.219136S
                        30day: P0DT0H29M7.796547S
                      mutable: true
      x-codeSamples:
      - lang: Shell
        source: 'curl -X GET "https://api.cryptoquant.com/v1/btc/exchange-flows/reserve/latency" \

          -H "Authorization: Bearer <YOUR_API_KEY>"'
      - lang: JavaScript
        source: "fetch(\"https://api.cryptoquant.com/v1/btc/exchange-flows/reserve/latency\", { headers: { \"Authorization\": \"Bearer <YOUR_API_KEY>\"} })\n  .then(response => response.json())\n  .then(data => console.log(data))"
      - lang: NodeJS
        source: "require('axios')\n  .get(\"https://api.cryptoquant.com/v1/btc/exchange-flows/reserve/latency\", { headers: { Authorization: 'Bearer <YOUR_API_KEY>' } })\n  .then(response => console.log(response))"
      - lang: Ruby
        source: 'require ''net/http''

          uri = URI("https://api.cryptoquant.com/v1/btc/exchange-flows/reserve/latency")

          req = Net::HTTP::Get.new(uri)

          req["Authorization"] = "Bearer <YOUR_API_KEY>"

          res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }

          puts res.body'
      - lang: Python
        source: 'import requests

          headers = {''Authorization'': ''Bearer <YOUR_API_KEY>''}

          url = "https://api.cryptoquant.com/v1/btc/exchange-flows/reserve/latency"

          print(requests.get(url, headers=headers).json())'
components:
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'For each API request, include this HTTP header:

        `Authorization` with the `Bearer <YOUR_API_KEY>`. Bearer access token is the type of HTTP Authorization.  You have to include access token to the HTTP header and note that leading bearer is required.

        You must include your access token in HTTP header in every request you make. The token is unique, issued for each client, and regularly changed(once a year). To obtain an access token, please [upgrade your plan](https://cryptoquant.com/pricing) to Professional or Premium plan. You''ll be able to see your access token on the [API tab](https://cryptoquant.com/settings/api) of your profile page after the subscription.'
    QueryParameter:
      type: apiKey
      name: api_key
      in: query
      description: 'For each API reqeust, include `api_key` parameter.

        You must request with your access token in query parameter in every request you make. The token is unique, issued for each client, and regularly changed(once a year). To obtain an access token, please [upgrade your plan](https://cryptoquant.com/pricing) to Professional or Premium plan. You''ll be able to see your access token on the [API tab](https://cryptoquant.com/settings/api) of your profile page after the subscription.

        If you are using Excel, you can use the `api_key` parameter to request with your access token to return data either in `json` or `csv`.'
