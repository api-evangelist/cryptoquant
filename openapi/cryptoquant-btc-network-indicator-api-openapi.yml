  /btc/network-indicator/nupl:
    get:
      tags:
      - BTC Network Indicator
      summary: Net Unrealized Profit and Loss
      description: 'Net Unrealized Profit and Loss shows how different between `market_cap` and `realized_cap`.

        `nupl` is calculated as difference between `market_cap` and `realized_cap` divided by `market_cap`.

        If `market_cap` > `realized_cap`, then `nupl` > 0, which means bitcoin on-chain expected value is less than what they actually have.

        So this value will give selling pressure.

        `nup` is net unrealized profit, which is calculated as sum of products of UTxO''s value and price difference between created and destroyed, divided by `market_cap`.

        `nup` only contains UTxOs in profit.

        `nul` is net unrealized loss. This is opposite indicator of `nup`.

        It only contains UTxOs in loss.


        **📖 Data Guide:** Net Unrealized Profit/Loss (NUPL) — definition, interpretation, and chart examples.'
      operationId: getNUPL
      parameters:
      - description: Currently we support `day` and `block`.
        explode: false
        in: query
        name: window
        schema:
          type: string
          default: day
        style: form
        example: day
      - description: This defines the starting time for which data will be gathered, formatted as YYYYMMDDTHHMMSS (indicating YYYY-MM-DDTHH:MM:SS, UTC time). If window=day is used, it can also be formatted as YYYYMMDD (date). If window=block is used, you can also specify the exact block height (e.g. 510000). If this field is not specified, response will include data from the earliest time.
        explode: false
        in: query
        name: from
        required: false
        schema:
          type: string
        style: form
        example: 20191001T100000
      - description: This defines the ending time for which data will be gathered, formatted as YYYYMMDDTHHMMSS (indicating YYYY-MM-DDTHH:MM:SS, UTC time). If window=day is used, it can also be formatted as YYYYMMDD (date). If window=block is used, you can also specify the exact block height (e.g. 510000). If this field is not specified, response will include data from the latest time.
        explode: false
        in: query
        name: to
        required: false
        schema:
          type: string
        style: form
        example: 20191001T103025
      - description: The maximum number of entries to return before the latest data point (or before `to` if specified). This field ranges from 1 to 100,000.
