  /btc/network-indicator/nvm:
    get:
      tags:
      - BTC Network Indicator
      summary: NVM
      description: 'NVM(Network Value to Metcalfe Ratio) is a metric based on Metcalfe’s law; the value of a network is proportional to the square of its nodes or user. NVM is a ratio of market cap divided by daily active address. Based on Metcalfe’s law, the value of bitcoin rises if the daily active addresses increase. Therefore, if the NVM value is relatively small, it means that the value of the network is underestimated and if the value is relatively high, it means that the value of the network is overestimated.

        __Go to Data Guide‣__


        **📖 Data Guide:** NVM Ratio — definition, interpretation, and chart examples.'
      operationId: getNVM
      parameters:
      - description: Currently, we only support `day`.
        explode: false
        in: query
        name: window
        schema:
          type: string
          default: day
        style: form
