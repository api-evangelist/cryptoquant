openapi: 3.2.0
info:
  version: 1.3.0
  title: CryptoQuant Data XRP Network Data API
  termsOfService: https://cryptoquant.com/terms-of-service
  contact:
    name: API Support
    email: contact@cryptoquant.com
  description: The CryptoQuant Data API provides simple and powerful endpoints to get information on general transaction data and aggregate on-chain statistics straight from the blockchain. The API root endpoint URL is `https://api.cryptoquant.com/v1/`.
servers:
- url: https://api.cryptoquant.com/v1
  description: Default server
tags:
- name: XRP Network Data
  description: This namespace contains endpoints to retrieve metrics related to XRP Network Data.
paths:
  /xrp/network-data/addresses-count:
    get:
      tags:
      - XRP Network Data
      summary: Addresses Count
      description: 'This endpoint returns metrics relating to the number of used XRP addresses.

        | Metric | Description |

        |--------|-------------|

        | `addresses_count_active` | The total number of unique addresses that were active (either sender or receiver) on the blockchain in a given window. |

        | `addresses_count_sender` | The number of addresses that were active as a sender. |

        | `addresses_count_receiver` | The number of addresses that were active as a receiver. |'
      operationId: XRPNetworkDatagetAddressesCount
      parameters:
      - description: Currently, we only support `day`.
        explode: false
        in: query
        name: window
        schema:
          type: string
          default: day
        style: form
        example: day
      - description: This defines the starting time for which data will be gathered, formatted as YYYYMMDDTHHMMSS (indicating YYYY-MM-DDTHH:MM:SS, UTC time). If window=day is used, it can also be formatted as YYYYMMDD (date). If window=block is used, you can also specify the exact block height (e.g. 510000). If this field is not specified, response will include data from the earliest time.
        explode: false
        in: query
        name: from
        required: false
        schema:
          type: string
        style: form
        example: 20191001T100000
      - description: This defines the ending time for which data will be gathered, formatted as YYYYMMDDTHHMMSS (indicating YYYY-MM-DDTHH:MM:SS, UTC time). If window=day is used, it can also be formatted as YYYYMMDD (date). If window=block is used, you can also specify the exact block height (e.g. 510000). If this field is not specified, response will include data from the latest time.
        explode: false
        in: query
        name: to
        required: false
        schema:
          type: string
        style: form
        example: 20191001T103025
      - description: The maximum number of entries to return before the latest data point (or before `to` if specified). This field ranges from 1 to 100,000.
        explode: false
        in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 100000
        style: form
        example: 100
      - description: A format type about return message type. Supported formats are json, csv.
        explode: false
        in: query
        name: format
        required: false
        schema:
          type: string
          default: json
        style: form
        example: json
      x-codeSamples:
      - lang: Shell
        source: 'curl -X GET "https://api.cryptoquant.com/v1/xrp/network-data/addresses-count?window=day&from=20191001&limit=2" \

          -H "Authorization: Bearer <YOUR_API_KEY>"'
      - lang: JavaScript
        source: "fetch(\"https://api.cryptoquant.com/v1/xrp/network-data/addresses-count?window=day&from=20191001&limit=2\", { headers: { \"Authorization\": \"Bearer <YOUR_API_KEY>\"} })\n  .then(response => response.json())\n  .then(data => console.log(data))"
      - lang: NodeJS
        source: "require('axios')\n  .get(\"https://api.cryptoquant.com/v1/xrp/network-data/addresses-count?window=day&from=20191001&limit=2\", { headers: { Authorization: 'Bearer <YOUR_API_KEY>' } })\n  .then(response => console.log(response))"
      - lang: Ruby
        source: 'require ''net/http''

          uri = URI("https://api.cryptoquant.com/v1/xrp/network-data/addresses-count?window=day&from=20191001&limit=2")

          req = Net::HTTP::Get.new(uri)

          req["Authorization"] = "Bearer <YOUR_API_KEY>"

          res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }

          puts res.body'
      - lang: Python
        source: 'import requests

          headers = {''Authorization'': ''Bearer <YOUR_API_KEY>''}

          url = "https://api.cryptoquant.com/v1/xrp/network-data/addresses-count?window=day&from=20191001&limit=2"

          print(requests.get(url, headers=headers).json())'
      responses:
        '200':
          description: The number of active addresses
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - result
                properties:
                  status:
                    type: object
                    description: The status object is return with most of requests and indicates if the request was successful. If it is not successful, error information is included.
                    properties:
                      code:
                        type: integer
                        format: int32
                        description: HTTP status code
                      message:
                        type: string
                        description: Text description of the error or success.
                    required:
                    - code
                    - message
                  result:
                    type: object
                    required:
                    - window
                    - data
                    properties:
                      window:
                        type: string
                        description: The size of window. This metric supports only day resolution.
                      data:
                        type: array
                        items:
                          type: object
                          required:
                          - active_account
                          - total_account
                          - sending_account
                          - recieving_account
                          properties:
                            date:
                              type: string
                              description: The date in YYYY-DD-MM. This optional field only appears when window=day is used.
                            active_account:
                              type: number
                              description: The total number of unique addresses that were active (either sender or receiver) on the blockchain in a given window.
                            total_account:
                              type: number
                              description: The total number of unique addresses
                            sending_account:
                              type: number
                              description: The number of addresses that were active as a sender.
                            recieving_account:
                              type: number
                              description: The number of addresses that were active as a receiver.
              example:
                status:
                  code: 200
                  message: success
                result:
                  window: day
                  data:
                  - date: '2026-06-14'
                    active_account: 16320
                    sending_account: 15598
                    receiving_account: 26766
                    total_account: 8360175
                  - date: '2026-06-13'
                    active_account: 15976
                    sending_account: 15329
                    receiving_account: 26856
                    total_account: 8358179
      security:
      - AccessToken: []
  /xrp/network-data/velocity:
    get:
      tags:
      - XRP Network Data
      summary: Velocity
      description: Velocity measures how quickly units circulate in the network. It is calculated by dividing on-chain transaction volume by market cap, effectively being the inverse of the NVT Ratio.
      operationId: XRPNetworkDatagetVelocity
      parameters:
