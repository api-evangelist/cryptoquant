      tags:
      - Stablecoin Network Data
      summary: Events Count
      description: 'This endpoint returns metrics related to the number of events. We provide several metrics. events_mint_count, events_issue_count, events_burn_count and events_redeem_count are metrics that represent the number of events related to each actions (mint, issue, burn, redeem). For further information about the actions, please refer to the section Stablecoin Issuing Mechanism.


        **📖 Data Guide:** Stablecoin Network Data — definition, interpretation, and chart examples.'
      operationId: getEventsCountSC
      parameters:
      - description: A Stablcoin token from the table that we support. [See here](#tag/Supported-Stablecoin-List)
        explode: false
        in: query
        name: token
        required: true
        schema:
          type: string
        style: form
        example: usdt_eth
      - description: Currently we support `day` and `block`.
        explode: false
        in: query
        name: window
        schema:
          type: string
