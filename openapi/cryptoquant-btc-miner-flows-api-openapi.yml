                      message:
                        type: string
                        description: Text description of the error or success.
                    required:
                    - code
                    - message
                  result:
                    type: object
                    required:
                    - window
                    - data
                    properties:
                      window:
                        type: string
                        description: The size of window. It can be day or block, and it depends on the user request.
                      data:
                        type: array
                        items:
                          type: object
                          required:
                          - transactions_count_inflow
                          - transactions_count_outflow
                          properties:
                            blockheight:
                              type: string
                              description: The height of the block. This optional field only appears when window=block is used.
                            date:
                              type: string
                              description: The date in YYYY-DD-MM. This optional field only appears when window=day is used.
                            datetime:
                              type: string
                              description: The date and time formatted as YYYY-MM-DD HH:MM:SS (UTC time). This field only appears when window=block or window=hour is used.
                            transactions_count_inflow:
                              type: number
                              description: The number of transactions sent to the miner.
                            transactions_count_outflow:
                              type: number
                              description: The number of transactions sent from the miner.
              example:
                status:
                  code: 200
                  message: success
                result:
                  window: day
                  data:
                  - date: '2026-06-14'
                    transactions_count_inflow: 480
                    transactions_count_outflow: 6677
                  - date: '2026-06-13'
                    transactions_count_inflow: 517
                    transactions_count_outflow: 11543
      security:
      - AccessToken: []
