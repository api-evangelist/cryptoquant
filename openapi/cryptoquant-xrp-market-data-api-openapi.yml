      security:
      - AccessToken: []
  /xrp/market-data/taker-buy-sell-stats:
    get:
      tags:
      - XRP Market Data
      summary: Taker Buy Sell Stats
      description: 'Taker Buy/Sell Stats represent takers'' sentiment of which position they are taking in the market. This metric is calculated with perpetual swap trades in each exchange.

        `taker_buy_volume` is volume that takers buy.

        `taker_sell_volume` is volume that takers sell.

        `taker_total_volume` is the sum of `taker_buy_volume` and `taker_sell_volume`.

        `taker_buy_ratio` is the ratio of `taker_buy_volume` divided by `taker_total_volume`.

        `taker_sell_ratio` is the ratio of `taker_sell_volume` divided by `taker_total_volume`.

        `taker_buy_sell_ratio` is the ratio of `taker_buy_volume` divided by `taker_sell_volume`.

        Note we unify the unit of return value to USD for each exchange where its contract specification may vary.

        | Name | Exchange | Symbol |

        |----------------|--------------|----|

        | All Exchanges | `all_exchange` | `all_symbol`* |

        | Binance | `binance` | `xrp_usdt`* |

        | Bybit | `bybit` | `xrp_usd`* |

        | Bitmex | `bitmex` | `xrp_usd`* |

        | HTX Global | `htx_global` | `xrp_usd`* |

        | OKX | `okx` | `xrp_usd`* |


        **📖 Data Guide:** Taker Buy Sell Volume/Ratio — definition, interpretation, and chart examples.'
      operationId: XRPgetTakerBuySellStats
      parameters:
      - description: An exchange from the table that we support. [See here](#tag/BTC-Exchange-Flows).
        explode: false
        in: query
        name: exchange
        required: true
        schema:
          type: string
        style: form
        example: binance
      - description: Currently we support `day`, `hour`, and `min`.
        explode: false
        in: query
        name: window
        schema:
          type: string
          default: day
        style: form
        example: day
