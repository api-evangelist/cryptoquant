openapi: 3.2.0
info:
  version: 1.3.0
  title: CryptoQuant Data XRP Market Data API
  termsOfService: https://cryptoquant.com/terms-of-service
  contact:
    name: API Support
    email: contact@cryptoquant.com
  description: The CryptoQuant Data API provides simple and powerful endpoints to get information on general transaction data and aggregate on-chain statistics straight from the blockchain. The API root endpoint URL is `https://api.cryptoquant.com/v1/`.
servers:
- url: https://api.cryptoquant.com/v1
  description: Default server
tags:
- name: XRP Market Data
  description: This namespace contains endpoints to retrieve metrics related to XRP Market Data.
paths:
  /xrp/market-data/price-ohlcv:
    get:
      tags:
      - XRP Market Data
      summary: Price OHLCV
      description: 'This endpoint returns metrics related to XRP''s Price.

        Price OHLCV data consists of five metrics.

        `open`, the opening price at the beginning of the window, `close`, USD closing price at the end of the window,

        `high`, the highest USD price in a given window, `low`, the lowest USD price in a given window,

        and `volume`, the total token volume traded in 24h.


        ### Supported Exchanges By Market


        | Name | Market | Supported Exchanges |

        |--------|---------|----------------------------|

        | Spot | `spot` | All Exchange*, Binance, Binance US, Bitfinex, Kucoin, Coinbase Advanced, Kraken, HTX Global |

        | Perpetual | `perpetual` | All Exchange*, Binance, Deribit, Bitmex, OKX |


        > (*) Default exchange


        ### Supported Pairs By Exchange


        #### ◦ Spot


        | Name | Exchange | Symbol |

        |----------------|--------------|----|

        | All Exchanges | `all_exchange` | `xrp_usd`* |

        | Binance | `binance` | `xrp_usdt`*

        `xrp_fdusd`

        `xrp_btc`

        `xrp_eth`

        `xrp_bnb`

        `xrp_rub`

        `xrp_tusd`|

        | Binance US | `binance_us` | `xrp_usdt`* |

        | Coinbase Advanced | `coinbase_advanced` | `xrp_eur`

        `xrp_usdt`

        `xrp_usd`* |

        | Bitfinex | `bitfinex` | `xrp_usdt`

        `xrp_btc`

        `xrp_usd`* |

        | HTX Global | `htx_global` | `xrp_usdt`* |

        | Kucoin | `kucoin` | `xrp_usdc`

        `xrp_tusd`

        `xrp_btc`

        `xrp_eth`

        `xrp_usdt`* |

        | Kraken | `kraken` | `xrp_usdt`

        `xrp_eur`

        `xrp_aud`

        `xrp_eth`

        `xrp_btc`

        `xrp_usd`* |


        #### ◦ Perpetual


        | Name | Exchange | Symbol |

        |----------------|--------------|----|

        | All Exchanges | `all_exchange` | `xrp_usd`*

        `xrp_usdt`|

        | Binance | `binance` | `xrp_usd`*|

        | Deribit | `deribit` | `xrp_usdc`* |

        | Okx | `okx` | `xrp_usdt`* |

        | Bitmex | `bitmex` | `xrp_usdt`

        `xrp_usd`* |


        ### Supported Windows By Market


        | Market | Supported Windows |

        |-----------|-------------------------------|

        | Spot | `min`, `hour`, `day*` |

        | Perpetual | `min`, `hour`, `day*` |'
      operationId: getPriceOHLCVXRP
      parameters:
      - description: A market type from the table that we support. [See here](#operation/getPriceOHLCVXRP)
        explode: false
        in: query
        name: market
        required: false
        schema:
          type: string
          default: spot
        style: form
        example: spot
      - description: A exchange from the table that we support. [See here](#operation/getPriceOHLCVXRP).
        explode: false
        in: query
        name: exchange
        required: false
        schema:
          type: string
          default: all_exchange
        style: form
        example: binance
      - description: A XRP pair symbol from the table that we support. [See here](#operation/getPriceOHLCVXRP)
        explode: false
        in: query
        name: symbol
        required: false
        schema:
          type: string
        style: form
        example: xrp_usd
      - description: Currently we support `day`, `hour`, and `min`.
        explode: false
        in: query
        name: window
        schema:
          type: string
          default: day
        style: form
        example: day
      - description: This defines the starting time for which data will be gathered, formatted as YYYYMMDDTHHMMSS (indicating YYYY-MM-DDTHH:MM:SS, UTC time). If window=day is used, it can also be formatted as YYYYMMDD (date). If window=block is used, you can also specify the exact block height (e.g. 510000). If this field is not specified, response will include data from the earliest time.
        explode: false
        in: query
        name: from
        required: false
        schema:
          type: string
        style: form
        example: 20191001T100000
      - description: This defines the ending time for which data will be gathered, formatted as YYYYMMDDTHHMMSS (indicating YYYY-MM-DDTHH:MM:SS, UTC time). If window=day is used, it can also be formatted as YYYYMMDD (date). If window=block is used, you can also specify the exact block height (e.g. 510000). If this field is not specified, response will include data from the latest time.
        explode: false
        in: query
        name: to
        required: false
        schema:
          type: string
        style: form
        example: 20191001T103025
      - description: The maximum number of entries to return before the latest data point (or before `to` if specified). This field ranges from 1 to 100,000.
        explode: false
        in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 100000
        style: form
        example: 100
      - description: A format type about return message type. Supported formats are json, csv.
        explode: false
        in: query
        name: format
        required: false
        schema:
          type: string
          default: json
        style: form
        example: json
      x-codeSamples:
      - lang: Shell
        source: 'curl -X GET "https://api.cryptoquant.com/v1/xrp/market-data/price-ohlcv?window=day&from=20191001&limit=2" \

          -H "Authorization: Bearer <YOUR_API_KEY>"'
      - lang: JavaScript
        source: "fetch(\"https://api.cryptoquant.com/v1/xrp/market-data/price-ohlcv?window=day&from=20191001&limit=2\", { headers: { \"Authorization\": \"Bearer <YOUR_API_KEY>\"} })\n  .then(response => response.json())\n  .then(data => console.log(data))"
      - lang: NodeJS
        source: "require('axios')\n  .get(\"https://api.cryptoquant.com/v1/xrp/market-data/price-ohlcv?window=day&from=20191001&limit=2\", { headers: { Authorization: 'Bearer <YOUR_API_KEY>' } })\n  .then(response => console.log(response))"
      - lang: Ruby
        source: 'require ''net/http''

          uri = URI("https://api.cryptoquant.com/v1/xrp/market-data/price-ohlcv?window=day&from=20191001&limit=2")

          req = Net::HTTP::Get.new(uri)

          req["Authorization"] = "Bearer <YOUR_API_KEY>"

          res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }

          puts res.body'
      - lang: Python
        source: 'import requests

          headers = {''Authorization'': ''Bearer <YOUR_API_KEY>''}

          url = "https://api.cryptoquant.com/v1/xrp/market-data/price-ohlcv?window=day&from=20191001&limit=2"

          print(requests.get(url, headers=headers).json())'
      responses:
        '200':
          description: Price OHLCV Data
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - result
                properties:
                  status:
                    type: object
                    description: The status object is return with most of requests and indicates if the request was successful. If it is not successful, error information is included.
                    properties:
                      code:
                        type: integer
                        format: int32
                        description: HTTP status code
                      message:
                        type: string
                        description: Text description of the error or success.
                    required:
                    - code
                    - message
                  result:
                    type: object
                    required:
                    - window
                    - data
                    properties:
                      window:
                        type: string
                        description: The size of window. It can be day, hour, min, or block and it depends on the user request.
                      data:
                        type: array
                        items:
                          type: object
                          required:
                          - open
                          - high
                          - low
                          - close
                          - volume
                          properties:
                            date:
                              type: string
                              description: The date in YYYY-DD-MM. This optional field only appears when window=day is used.
                            blockheight:
                              type: string
                              description: The height of the block. This optional field only appears when window=block is used.
                            datetime:
                              type: string
                              description: The date and time formatted as YYYY-MM-DDTHH:MM:SS (UTC time). This field only appears when window=block or window=min is used.
                            open:
                              type: number
                              description: opening price at the beginning of the window.
                            high:
                              type: number
                              description: opening price at the end of the window.
                            low:
                              type: number
                              description: The highest price in a given window.
                            close:
                              type: number
                              description: The lowest price in a given window.
                            volume:
                              type: number
                              description: The total traded amount in a given window.
              example:
                status:
                  code: 200
                  message: success
                result:
                  window: day
                  data:
                  - date: '2026-06-14'
                    open: 1.1498387
                    high: 1.1869
                    low: 1.1268
                    close: 1.1851
                    volume: 16030257.89
                  - date: '2026-06-13'
                    open: 1.13107597
                    high: 1.1598
                    low: 1.12924
                    close: 1.149
                    volume: 20368737.2
      security:
      - AccessToken: []
  /xrp/market-data/open-interest:
    get:
      tags:
      - XRP Market Data
      summary: Open Interest
      description: 'This endpoint returns XRP Perpetual Open Interest from derivative exchanges.

        | Name | Exchange | Symbol |

        |----------------|--------------|----|

        | All Exchanges | `all_exchange` | `all_symbol`* |

        | Binance | `binance` | `xrp_usdt`

        `xrp_usd`

        `all_symbol`*|

        | Bybit | `bybit` | `xrp_usdt`

        `xrp_usd`

        `all_symbol`*|

        | Bitmex | `bitmex` | `xrp_usd`* |

        | HTX Global | `htx_global` | `xrp_usdt`* |

        | Kraken | `kraken` | `xrp_usd`* |

        | OKX | `okx` | `xrp_usdt`

        `xrp_usd`

        `all_symbol`* |

        | Bitfinex | `bitfinex` | `xrp_usdt`* |


        Supported exchanges for Open Interest are available in Discovery section.

        Note we unify the unit of return value to USD for each exchange where its contract specification may vary.


