      - lang: JavaScript
        source: "fetch(\"https://api.cryptoquant.com/v1/xrp/market-data/open-interest?window=day&from=20191001&exchange=bitmex\", { headers: { \"Authorization\": \"Bearer <YOUR_API_KEY>\"} })\n  .then(response => response.json())\n  .then(data => console.log(data))"
      - lang: NodeJS
