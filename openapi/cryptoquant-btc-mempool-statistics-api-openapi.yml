openapi: 3.2.0
info:
  version: 1.3.0
  title: CryptoQuant Data BTC Mempool Statistics API
  termsOfService: https://cryptoquant.com/terms-of-service
  contact:
    name: API Support
    email: contact@cryptoquant.com
  description: The CryptoQuant Data API provides simple and powerful endpoints to get information on general transaction data and aggregate on-chain statistics straight from the blockchain. The API root endpoint URL is `https://api.cryptoquant.com/v1/`.
servers:
- url: https://api.cryptoquant.com/v1
  description: Default server
tags:
- name: BTC Mempool Statistics
  description: 'This namespace contains endpoints to retrieve statistics on Memory Pool in Bitcoin network. We provide certain metrics such as transaction count, total transaction size, total transaction fee on memory pool, based on fee range, including aggregated metrics.

    For more detailed information, please refer to the description of each metric.'
paths:
  /btc/mempool/stats-by-relative-fee:
    get:
      tags:
      - BTC Mempool Statistics
      summary: BTC Memory pool Statistics by relative fee range
      description: 'Mempool Statistics contains three metrics related to transactions waiting to be confirmed. You can see metrics for the number of transactions, the total amount of fees, and the aggregate size in bytes of transactions. Each metric was calculated based on fee level.


        ### Supported Metrics

        | Metric Type | Description |

        |--------------|--------------------------------------------------------|

        | `tx_count*` | The total number of unconfirmed transactions (Number) |

        | `total_size` | The aggregated size in bytes of transactions (Megabyte)|

        | `total_fee` | The total fee of unconfirmed transactions (BTC) |


        > (*) Default


        ### Supported Windows


        | Supported Windows |

        |-------------------|

        | `hour`, `day*` |


        > (*) Default'
      operationId: getBTCMempoolStatsByRelativeFee
      parameters:
      - description: A metric type derived from statistics. Supported formats are json, csv.
        explode: false
        in: query
        name: metric_type
        required: false
        schema:
          type: string
          default: tx_count
        style: form
        example: tx_count
      - description: Currently, we support `day` and `hour`.
        explode: false
        in: query
        name: window
        schema:
          type: string
          default: day
        style: form
        example: day
      - description: This defines the starting time for which data will be gathered, formatted as YYYYMMDDTHHMMSS (indicating YYYY-MM-DDTHH:MM:SS, UTC time). If window=day is used, it can also be formatted as YYYYMMDD (date). If window=block is used, you can also specify the exact block height (e.g. 510000). If this field is not specified, response will include data from the earliest time.
        explode: false
        in: query
        name: from
        required: false
        schema:
          type: string
        style: form
        example: 20191001T100000
      - description: This defines the ending time for which data will be gathered, formatted as YYYYMMDDTHHMMSS (indicating YYYY-MM-DDTHH:MM:SS, UTC time). If window=day is used, it can also be formatted as YYYYMMDD (date). If window=block is used, you can also specify the exact block height (e.g. 510000). If this field is not specified, response will include data from the latest time.
        explode: false
        in: query
        name: to
        required: false
        schema:
          type: string
        style: form
        example: 20191001T103025
      - description: The maximum number of entries to return before the latest data point (or before `to` if specified). This field ranges from 1 to 100,000.
        explode: false
        in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 100000
        style: form
        example: 100
      - description: A format type about return message type. Supported formats are json, csv.
        explode: false
        in: query
        name: format
        required: false
        schema:
          type: string
          default: json
        style: form
        example: json
      x-codeSamples:
      - lang: Shell
        source: 'curl -X GET "https://api.cryptoquant.com/v1/btc/mempool/stats-by-relative-fee?window=day&metric_type=tx_count&limit=2" \

          -H "Authorization: Bearer <YOUR_API_KEY>"'
      - lang: JavaScript
        source: "fetch(\"https://api.cryptoquant.com/v1/btc/mempool/stats-by-relative-fee?window=day&metric_type=tx_count&limit=2\", { headers: { \"Authorization\": \"Bearer <YOUR_API_KEY>\"} })\n  .then(response => response.json())\n  .then(data => console.log(data))"
      - lang: NodeJS
        source: "require('axios')\n  .get(\"https://api.cryptoquant.com/v1/btc/mempool/stats-by-relative-fee?window=day&metric_type=tx_count&limit=2\", { headers: { Authorization: 'Bearer <YOUR_API_KEY>' } })\n  .then(response => console.log(response))"
      - lang: Ruby
        source: 'require ''net/http''

          uri = URI("https://api.cryptoquant.com/v1/btc/mempool/stats-by-relative-fee?window=day&metric_type=tx_count&limit=2")

          req = Net::HTTP::Get.new(uri)

          req["Authorization"] = "Bearer <YOUR_API_KEY>"

          res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }

          puts res.body'
      - lang: Python
        source: 'import requests

          headers = {''Authorization'': ''Bearer <YOUR_API_KEY>''}

          url = "https://api.cryptoquant.com/v1/btc/mempool/stats-by-relative-fee?window=day&metric_type=tx_count&limit=2"

          print(requests.get(url, headers=headers).json())'
      responses:
        '200':
          description: BTC Mempool Stats by relative fee
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - result
                properties:
                  status:
                    type: object
                    description: The status object is return with most of requests and indicates if the request was successful. If it is not successful, error information is included.
                    properties:
                      code:
                        type: integer
                        format: int32
                        description: HTTP status code
                      message:
                        type: string
                        description: Text description of the error or success.
                    required:
                    - code
                    - message
                  result:
                    type: object
                    required:
                    - window
                    - data
                    properties:
                      window:
                        type: string
                        description: The size of window. It can be day or hour, and it depends on the user request.
                      data:
                        type: array
                        items:
                          type: object
                          required:
                          - date
                          - metric_type
                          - metric_unit
                          - relative_fee_range_a_b
                          properties:
                            date:
                              type: string
                              description: The date and time formatted as YYYY-MM-DD HH:MM:SS (UTC time). This field only appears when window=block is used.
                            metric_type:
                              type: string
