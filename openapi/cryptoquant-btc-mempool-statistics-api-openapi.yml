      description: 'Mempool Statistics contains three metrics related to transactions waiting to be confirmed. You can see metrics for the number of transactions, the total amount of fees, and the aggregate size in bytes of transactions.


        ### Supported Metrics

        | Metric Type | Description |

        |--------------|--------------------------------------------------------------------------------------|

        | `tx_count*` | The average number of unconfirmed transactions in selected time range (Number) |

        | `total_size` | The average aggregate size in bytes of transactions in selected time range (Megabyte)|

        | `total_fee` | The average total fee of unconfirmed transactions in selected time range (BTC) |


        > (*) Default


        ### Supported Windows


        | Supported Windows |

        |-------------------|

        | `hour`, `day*` |


        > (*) Default'
      operationId: getBTCMempoolStatsInTotal
      parameters:
      - description: A metric type derived from statistics. Supported formats are json, csv.
        explode: false
        in: query
        name: metric_type
        required: false
        schema:
          type: string
          default: tx_count
        style: form
        example: tx_count
      - description: Currently, we support `day` and `hour`.
        explode: false
        in: query
        name: window
        schema:
          type: string
          default: day
        style: form
        example: day
      - description: This defines the starting time for which data will be gathered, formatted as YYYYMMDDTHHMMSS (indicating YYYY-MM-DDTHH:MM:SS, UTC time). If window=day is used, it can also be formatted as YYYYMMDD (date). If window=block is used, you can also specify the exact block height (e.g. 510000). If this field is not specified, response will include data from the earliest time.
        explode: false
        in: query
