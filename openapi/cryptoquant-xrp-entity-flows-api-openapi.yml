                      data:
                        type: array
                        items:
                          type: object
                          required:
                          - transactions_count_deposit
                          - transactions_count_withdraw
                          properties:
                            blockheight:
                              type: string
                              description: The height of the block. This optional field only appears when window=block is used.
                            date:
                              type: string
                              description: The date in YYYY-DD-MM. This optional field only appears when window=day is used.
                            datetime:
                              type: string
                              description: The date and time formatted as YYYY-MM-DD HH:MM:SS (UTC time). This field only appears when window=block or window=hour is used.
                            transactions_count_deposit:
                              type: number
                              description: The number of transactions sent to the entity.
                            transactions_count_withdraw:
                              type: number
                              description: The number of transactions sent from the entity.
              example:
                status:
                  code: 200
                  message: success
                result:
                  window: day
                  data:
                  - date: '2026-06-15'
                    transactions_count_deposit: '79'
                    transactions_count_withdraw: '87'
                  - date: '2026-06-14'
                    transactions_count_deposit: '120'
                    transactions_count_withdraw: '134'
      security:
      - AccessToken: []
